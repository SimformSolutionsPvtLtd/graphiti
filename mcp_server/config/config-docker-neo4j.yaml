# Graphiti MCP Server Configuration
# Configured for Azure OpenAI + Neo4j (shared with NeuVantage stack)

server:
  transport: "http"
  host: "0.0.0.0"
  port: 8000

llm:
  provider: "azure_openai"
  model: ${AZURE_OPENAI_DEPLOYMENT:-thoughtmesh-gpt-4o}
  max_tokens: 4096

  providers:
    azure_openai:
      api_key: ${AZURE_OPENAI_API_KEY}
      api_url: ${AZURE_OPENAI_ENDPOINT}
      api_version: ${AZURE_OPENAI_API_VERSION:-2024-12-01-preview}
      deployment_name: ${AZURE_OPENAI_DEPLOYMENT:-thoughtmesh-gpt-4o}
      use_azure_ad: false

embedder:
  provider: "azure_openai"
  model: ${AZURE_OPENAI_EMBEDDINGS_DEPLOYMENT:-text-embedding-3-small}
  dimensions: 1536

  providers:
    azure_openai:
      api_key: ${AZURE_OPENAI_API_KEY}
      api_url: ${AZURE_OPENAI_EMBEDDINGS_ENDPOINT:-${AZURE_OPENAI_ENDPOINT}}
      api_version: ${AZURE_OPENAI_API_VERSION:-2024-12-01-preview}
      deployment_name: ${AZURE_OPENAI_EMBEDDINGS_DEPLOYMENT:-text-embedding-3-small}
      use_azure_ad: false

reranker:
  provider: "azure_openai"
  model: ${AZURE_OPENAI_DEPLOYMENT:-thoughtmesh-gpt-4o}

  providers:
    azure_openai:
      api_key: ${AZURE_OPENAI_API_KEY}
      api_url: ${AZURE_OPENAI_ENDPOINT}
      api_version: ${AZURE_OPENAI_API_VERSION:-2024-12-01-preview}
      deployment_name: ${AZURE_OPENAI_DEPLOYMENT:-thoughtmesh-gpt-4o}
      use_azure_ad: false


database:
  provider: "neo4j"

  providers:
    neo4j:
      uri: ${NEO4J_URI:-bolt://host.docker.internal:7687}
      username: ${NEO4J_USER:-neo4j}
      password: ${NEO4J_PASSWORD:-mysecretpassword}
      database: ${NEO4J_DATABASE:-neuvantage}
      use_parallel_runtime: false

graphiti:
  group_id: ${GRAPHITI_GROUP_ID:-neuvantage}
  episode_id_prefix: ${EPISODE_ID_PREFIX:}
  user_id: ${USER_ID:-mcp_user}
  entity_types:
    - name: "Preference"
      description: "User preferences, choices, opinions, or selections"
    - name: "Requirement"
      description: "Specific needs, features, or functionality that must be fulfilled"
    - name: "Procedure"
      description: "Standard operating procedures and sequential instructions"
    - name: "Location"
      description: "Physical or virtual places where activities occur"
    - name: "Event"
      description: "Time-bound activities, occurrences, or experiences"
    - name: "Organization"
      description: "Companies, institutions, groups, or formal entities"
    - name: "Document"
      description: "Information content in various forms (books, articles, reports, etc.)"
    - name: "Topic"
      description: "Subject of conversation, interest, or knowledge domain"
    - name: "Object"
      description: "Physical items, tools, devices, or possessions"
